<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JakMiris - Welcome</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <div class="logo-icon">🧺</div>
                <span class="logo-text">JakMiris</span>
            </div>
            
            <nav class="navigation">
                <a href="#" class="nav-link">Halaman Utama</a>
                <a href="#" class="nav-link">Bisnes</a>
                <a href="#" class="nav-link">Info JakMiris</a>
                <a href="#" class="nav-link">Info Terkini</a>
            </nav>

            <div class="header-right">
                <div class="search-bar">
                    <input type="text" placeholder="Search...">
                    <button class="search-btn">🔍</button>
                </div>
                <button class="icon-btn">🛒</button>
                <button class="icon-btn">👤</button>
                <div class="language-selector">
                    <span>En</span>
                    <span class="lang-sep">|</span>
                    <span class="active-lang">My</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Section -->
    <main class="main-section">
        <h1 class="welcome-title">Welcome to JakMiris.com</h1>
        
        <div class="content-wrapper">
            <!-- Left Side - Character & Message -->
            <div class="left-content">
                <div class="character-box">
                    <div class="speech-bubble">
                        <p>SHOP WITH<br>US AT JAK<br>MIRIS</p>
                    </div>
                    <div class="character-illustration">
                        👩
                    </div>
                </div>
            </div>

            <!-- Center - Product Image -->
            <div class="center-content">
                <img src="https://via.placeholder.com/450x400/F5DEB3/8B4513?text=Fresh+Vegetables" alt="Fresh Vegetables" class="product-image">
            </div>

            <!-- Right Side - Landscape -->
            <div class="right-content">
                <div class="landscape-image">
                    🌾
                </div>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div class="bottom-banner">
            <p>"Beli belah kini semudah di hujung jari – platform jual beli dalam talian khas untuk komuniti Padawan, murah, mudah dan dipercayai"</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 JakMiris. All rights reserved.</p>
    </footer>
</body>
</html>
