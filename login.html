<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – JakMiris</title>
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/loginstyle.css">
</head>
<body class="home-page">

  <header class="store-header">
    <div class="top-bar">
      <div class="brand-block">
        <img class="brand-logo" src="ICON/LOGO/Jak Miris Shop (4).png" alt="JakMiris Logo">
        <div class="brand-text"><span>JAKMIRIS</span></div>
      </div>
      <div class="top-actions">
        <span title="Cart">🛒</span>
        <span title="Language">EN | MY</span>
      </div>
    </div>
    <nav class="sub-nav">
      <a href="index.html">Halaman Utama</a>
      <a href="bisnes.html">Bisnes</a>
      <a href="profile.html">Profile</a>
      <a href="aboutus.html">About Us</a>
    </nav>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="ICON/LOGO/Jak Miris Shop (4).png" alt="JakMiris Logo">
        <h1>JAKMIRIS</h1>
        <p class="auth-tagline">Warisan Borneo, pilihan moden.</p>
      </div>

      <!-- Tab Switch -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Log Masuk</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Daftar</button>
      </div>

      <!-- Login Form -->
      <form id="form-login" class="auth-form" novalidate>
        <div id="login-alert" class="auth-alert hidden"></div>

        <div class="form-group">
          <label for="login-email">E-mel / Nama Pengguna</label>
          <input type="text" id="login-email" name="email" placeholder="contoh@email.com" autocomplete="username" required>
          <span class="field-error" id="err-login-email"></span>
        </div>

        <div class="form-group">
          <label for="login-password">Kata Laluan</label>
          <div class="password-wrap">
            <input type="password" id="login-password" name="password" placeholder="Masukkan kata laluan" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" onclick="togglePassword('login-password', this)" aria-label="Show password">👁</button>
          </div>
          <span class="field-error" id="err-login-password"></span>
        </div>

        <div class="form-row">
          <label class="remember-me">
            <input type="checkbox" name="remember"> Ingat saya
          </label>
          <a href="#" class="forgot-link">Lupa kata laluan?</a>
        </div>

        <button type="submit" class="btn-auth" id="btn-login">Log Masuk</button>

        <div class="divider"><span>atau</span></div>
        <button type="button" class="btn-social" onclick="socialLogin('google')">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20"> Teruskan dengan Google
        </button>
        <button type="button" class="btn-social" onclick="socialLogin('facebook')">
          <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" width="20"> Teruskan dengan Facebook
        </button>
      </form>

      <!-- Register Form -->
      <form id="form-register" class="auth-form hidden" novalidate>
        <div id="register-alert" class="auth-alert hidden"></div>

        <div class="form-group">
          <label for="reg-name">Nama Penuh</label>
          <input type="text" id="reg-name" name="name" placeholder="Nama Penuh Anda" autocomplete="name" required>
          <span class="field-error" id="err-reg-name"></span>
        </div>

        <div class="form-group">
          <label for="reg-email">E-mel</label>
          <input type="email" id="reg-email" name="email" placeholder="contoh@email.com" autocomplete="email" required>
          <span class="field-error" id="err-reg-email"></span>
        </div>

        <div class="form-group">
          <label for="reg-phone">Nombor Telefon</label>
          <input type="tel" id="reg-phone" name="phone" placeholder="+60 12-345 6789" autocomplete="tel">
          <span class="field-error" id="err-reg-phone"></span>
        </div>

        <div class="form-group">
          <label for="reg-password">Kata Laluan</label>
          <div class="password-wrap">
            <input type="password" id="reg-password" name="password" placeholder="Sekurang-kurangnya 8 aksara" autocomplete="new-password" required>
            <button type="button" class="toggle-pw" onclick="togglePassword('reg-password', this)" aria-label="Show password">👁</button>
          </div>
          <span class="field-error" id="err-reg-password"></span>
          <div class="strength-bar"><div id="strength-fill"></div></div>
          <span class="strength-label" id="strength-label"></span>
        </div>

        <div class="form-group">
          <label for="reg-confirm">Sahkan Kata Laluan</label>
          <div class="password-wrap">
            <input type="password" id="reg-confirm" name="confirm" placeholder="Ulang kata laluan" autocomplete="new-password" required>
            <button type="button" class="toggle-pw" onclick="togglePassword('reg-confirm', this)" aria-label="Show password">👁</button>
          </div>
          <span class="field-error" id="err-reg-confirm"></span>
        </div>

        <label class="remember-me terms-check">
          <input type="checkbox" id="reg-terms" required>
          Saya bersetuju dengan <a href="#">Terma &amp; Syarat</a> dan <a href="#">Dasar Privasi</a>
        </label>
        <span class="field-error" id="err-reg-terms"></span>

        <button type="submit" class="btn-auth" id="btn-register">Buat Akaun</button>
      </form>

    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
