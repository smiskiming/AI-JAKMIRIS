  <script>
    document.querySelectorAll('.pedagang-biodata').forEach((cardBody) => {
      if (cardBody.querySelector('.seller-actions')) {
        return;
      }

      const actions = document.createElement('div');
      actions.className = 'seller-actions';
      actions.innerHTML = '<button type="button" class="btn-view">Lihat Produk</button><button type="button" class="btn-contact">Hubungi</button>';
      cardBody.appendChild(actions);
    });

    const clickableSelectors = '.header-top a, .icons .icon, .lang .world-icon, .seller-actions button';
    const clickableElements = document.querySelectorAll(clickableSelectors);
    const navLinks = document.querySelectorAll('.header-top a');

    const normalizePath = (value) => value.toLowerCase().replace(/^.*[\\/]/, '');
    const currentPage = normalizePath(window.location.pathname || '');

    navLinks.forEach((link) => {
      const target = normalizePath(link.getAttribute('href') || '');
      if ((currentPage === '' && target === 'home.html') || target === currentPage || (currentPage === 'profile_new.html' && target === 'profile.html')) {
        link.classList.add('nav-active');
      }
    });

    clickableElements.forEach((element) => {
      element.addEventListener('click', () => {
        if (element.matches('.header-top a')) {
          navLinks.forEach((link) => link.classList.remove('nav-active'));
          element.classList.add('nav-active');
        }

        element.classList.remove('click-animate');
        // Force reflow so animation restarts on every click.
        void element.offsetWidth;
        element.classList.add('click-animate');

        setTimeout(() => {
          element.classList.remove('click-animate');
        }, 420);
      });
    });
  </script>
